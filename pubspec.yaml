name: jelajah_nusa
description: Belajar budaya dan bahasa Nusantara melalui materi singkat dan kuis.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  shared_preferences: 2.5.3
  cryptography: 2.7.0
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/brand/
    - assets/badges/
    - assets/data/content.json
  fonts:
    - family: NusaSans
      fonts:
        - asset: assets/fonts/NusaSans.ttf
        - asset: assets/fonts/NusaSans-Bold.ttf
          weight: 700
    - family: NusaSerif
      fonts:
        - asset: assets/fonts/NusaSerif.ttf
